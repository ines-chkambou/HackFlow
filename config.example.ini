# ============================================================
#  HackFlow / SmartHackathon - Modele de configuration Oracle
#
#  Copiez ce fichier en config.local.ini puis renseignez vos
#  identifiants. NE COMMITEZ JAMAIS config.local.ini.
#
#  Si le mode Oracle est demande et que ce fichier est absent ou
#  incomplet, l'application affiche une erreur et s'arrete.
#  Aucun repli automatique vers SQLite n'est effectue.
# ============================================================

[database]
# Moteur explicite obligatoire : sqlite ou oracle.
# Aucun moteur par defaut n'est applique.
# Peut aussi être surchargé pour un lancement ponctuel par HACKFLOW_DATABASE.
engine=sqlite
# engine=oracle

[oracle]
# Hote et port du serveur Oracle
host=localhost
port=1521

# Nom du service (SID) Oracle
service=XE

# Utilisateur Oracle
user=INES

# Mot de passe : laissez vide dans ce modele.
# Renseignez-le uniquement dans config.local.ini.
password=

# Pilote Qt à utiliser : QODBC ou QOCI.
# Absent = QODBC d'abord, puis QOCI si QODBC n'est pas disponible.
driver=QODBC

# Nom du pilote ODBC Oracle (utilise avec QODBC)
odbcDriver=Oracle in XE
